name: Build iOS IPA (AltStore / Sideloadly)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS project
        run: |
          npx expo prebuild --platform ios --clean

      - name: Debug Environment and Project Structure
        if: always()
        run: |
          echo "=== ROOT ===" > debug.txt
          ls -la >> debug.txt
          echo "=== IOS DIR ===" >> debug.txt
          ls -la ios >> debug.txt 2>&1 || true
          echo "=== POD INFO ===" >> debug.txt
          which pod >> debug.txt 2>&1 || true
          pod --version >> debug.txt 2>&1 || true
          echo "=== XCODE SCHEMES ===" >> debug.txt
          cd ios
          if [ -d "pinder.xcworkspace" ]; then
            xcodebuild -list -workspace pinder.xcworkspace >> ../debug.txt 2>&1 || true
          else
            echo "No pinder.xcworkspace found!" >> ../debug.txt
            xcodebuild -list -project *.xcodeproj >> ../debug.txt 2>&1 || true
          fi
          cd ..

      - name: Build iOS App
        run: |
          cd ios
          if [ -d "*.xcworkspace" ] || [ -d "pinder.xcworkspace" ]; then
            TARGET_FLAG="-workspace pinder.xcworkspace"
          else
            PROJ=$(ls -d *.xcodeproj | head -n 1)
            TARGET_FLAG="-project $PROJ"
          fi
          echo "Using target flag: $TARGET_FLAG"
          xcodebuild build \
            $TARGET_FLAG \
            -scheme pinder \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""
          cd ..

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_DIR=$(find build/derivedData -name "*.app" -type d | grep "Release-iphoneos" | head -n 1)
          echo "Found app bundle: $APP_DIR"
          cp -r "$APP_DIR" build/Payload/
          cd build
          zip -r -y pinder.ipa Payload
          ls -lh pinder.ipa

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinder-build-results
          path: |
            build/pinder.ipa
            debug.txt
          retention-days: 14
