name: Build iOS IPA (AltStore / Sideloadly)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Configure Manual Code Signing
        run: |
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/pinder.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' ios/pinder.xcodeproj/project.pbxproj || true

      - name: Build iOS App (Unsigned for AltStore)
        run: |
          xcodebuild \
            -workspace ios/pinder.xcworkspace \
            -scheme pinder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/derivedData/Build/Products/Release-iphoneos/pinder.app build/Payload/
          cd build
          zip -r -y pinder.ipa Payload
          ls -lh pinder.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinder-altstore-ipa
          path: build/pinder.ipa
          retention-days: 14
