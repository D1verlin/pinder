name: Build iOS IPA (AltStore / Sideloadly)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Configure Ad-Hoc Signing in Xcode Projects
        run: |
          python3 -c "
          import glob, re
          for path in glob.glob('ios/**/*.pbxproj', recursive=True):
              with open(path, 'r') as f:
                  text = f.read()
              text = text.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
              text = re.sub(r'DEVELOPMENT_TEAM = [^;]+;', 'DEVELOPMENT_TEAM = \"\";', text)
              text = re.sub(r'CODE_SIGN_IDENTITY = [^;]+;', 'CODE_SIGN_IDENTITY = \"-\";', text)
              text = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = [^;]+;', 'PROVISIONING_PROFILE_SPECIFIER = \"\";', text)
              with open(path, 'w') as f:
                  f.write(text)
              print(f'Patched {path}')
          "

      - name: Build iOS App for Physical Device
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1 || echo "")
          if [ -n "$WORKSPACE" ]; then
            TARGET="-workspace $WORKSPACE"
          else
            PROJ=$(ls -d *.xcodeproj | head -n 1)
            TARGET="-project $PROJ"
          fi
          echo "Building with target: $TARGET"
          
          xcodebuild build \
            $TARGET \
            -scheme pinder \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/derivedData \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            VALIDATE_PRODUCT=NO
          cd ..

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_DIR=$(find build/derivedData -name "*.app" -type d | grep "Release-iphoneos" | head -n 1)
          echo "Found app bundle: $APP_DIR"
          cp -r "$APP_DIR" build/Payload/
          cd build
          zip -r -y pinder.ipa Payload
          ls -lh pinder.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinder-altstore-ipa
          path: build/pinder.ipa
          retention-days: 14
