name: Build iOS IPA (AltStore / Sideloadly)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Configure CocoaPods and Disable Code Signing
        run: |
          python3 -c "
          import glob
          for path in glob.glob('ios/**/*.pbxproj', recursive=True):
              with open(path, 'r') as f:
                  text = f.read()
              text = text.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
              text = text.replace('CODE_SIGN_IDENTITY = \"Apple Development\";', 'CODE_SIGN_IDENTITY = \"\";')
              text = text.replace('CODE_SIGN_IDENTITY = \"iPhone Developer\";', 'CODE_SIGN_IDENTITY = \"\";')
              with open(path, 'w') as f:
                  f.write(text)
              print(f'Successfully patched {path}')
          "
          
          # Patch Podfile to disable signing on all pod targets and resource bundles
          python3 -c "
          podfile = 'ios/Podfile'
          with open(podfile, 'r') as f:
              content = f.read()
          hook = '''
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
              end
            end
          end
          '''
          if 'post_install' not in content:
              content += '\n' + hook
              with open(podfile, 'w') as f:
                  f.write(content)
              print('Added post_install hook to Podfile')
          "
          cd ios && pod install && cd ..

      - name: Build iOS App for Device
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1 || echo "")
          if [ -n "$WORKSPACE" ]; then
            TARGET="-workspace $WORKSPACE"
          else
            PROJ=$(ls -d *.xcodeproj | head -n 1)
            TARGET="-project $PROJ"
          fi
          echo "Building with target: $TARGET"
          
          set -o pipefail
          xcodebuild build \
            $TARGET \
            -scheme pinder \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee ../xcode.log || {
              ERRORS=$(grep -E "(error:|fatal error:|Signing for|No profile)" ../xcode.log | tail -n 8 | tr '\n' ' -- ')
              echo "::error title=XcodeCompilationFailure::$ERRORS"
              exit 1
            }
          cd ..

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_DIR=$(find build/derivedData -name "*.app" -type d | grep "Release-iphoneos" | head -n 1)
          echo "Found app bundle: $APP_DIR"
          cp -r "$APP_DIR" build/Payload/
          cd build
          zip -r -y pinder.ipa Payload
          ls -lh pinder.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinder-altstore-ipa
          path: build/pinder.ipa
          retention-days: 14
