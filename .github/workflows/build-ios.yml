name: Build iOS IPA (AltStore / Sideloadly)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Disable Code Signing in Xcode Project
        run: |
          python3 -c "
          import glob
          for path in glob.glob('ios/**/*.pbxproj', recursive=True):
              with open(path, 'r') as f:
                  text = f.read()
              text = text.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
              text = text.replace('CODE_SIGN_IDENTITY = \"Apple Development\";', 'CODE_SIGN_IDENTITY = \"\";')
              text = text.replace('CODE_SIGN_IDENTITY = \"iPhone Developer\";', 'CODE_SIGN_IDENTITY = \"\";')
              with open(path, 'w') as f:
                  f.write(text)
              print(f'Successfully patched {path}')
          "

      - name: Build iOS App for Device
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1 || echo "")
          if [ -n "$WORKSPACE" ]; then
            TARGET="-workspace $WORKSPACE"
          else
            PROJ=$(ls -d *.xcodeproj | head -n 1)
            TARGET="-project $PROJ"
          fi
          echo "Building with target: $TARGET"
          
          set -o pipefail
          xcodebuild build \
            $TARGET \
            -scheme pinder \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee ../xcode.log || {
              echo "## Xcode Build Failure Log" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep -E "(error:|fatal error:|Signing|Provisioning)" -B 2 -A 4 ../xcode.log | tail -n 50 >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            }
          cd ..

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_DIR=$(find build/derivedData -name "*.app" -type d | grep "Release-iphoneos" | head -n 1)
          echo "Found app bundle: $APP_DIR"
          cp -r "$APP_DIR" build/Payload/
          cd build
          zip -r -y pinder.ipa Payload
          ls -lh pinder.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinder-altstore-ipa
          path: build/pinder.ipa
          retention-days: 14
