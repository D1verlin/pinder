name: Build iOS IPA (AltStore / Sideloadly)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Inspect and Build iOS App
        run: |
          cd ios
          ls -la
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | grep -A 10 "Schemes:" | sed '1d' | head -n 1 | tr -d '[:space:]')
          echo "Found workspace: $WORKSPACE"
          echo "Found scheme: $SCHEME"
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""
          cd ..

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_DIR=$(find build/derivedData -name "*.app" -type d | grep "Release-iphoneos" | head -n 1)
          echo "Found app bundle: $APP_DIR"
          cp -r "$APP_DIR" build/Payload/
          cd build
          zip -r -y pinder.ipa Payload
          ls -lh pinder.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinder-altstore-ipa
          path: build/pinder.ipa
          retention-days: 14
