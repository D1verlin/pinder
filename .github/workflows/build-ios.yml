name: Build iOS IPA (AltStore / Sideloadly)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild iOS project
        run: |
          npx expo prebuild --platform ios --clean
          ls -la ios

      - name: Ensure CocoaPods Dependencies
        run: |
          if [ ! -d "ios/Pods" ] || [ ! -f "ios/pinder.xcworkspace/contents.xcworkspacedata" ]; then
            echo "Running pod install..."
            cd ios && pod install && cd ..
          else
            echo "Pods already installed by prebuild."
          fi
          ls -la ios

      - name: Build iOS App (Unsigned for AltStore)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/pinder.xcworkspace \
            -scheme pinder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee xcodebuild.log || (echo "=== XCODEBUILD FAILED (LAST 80 LINES) ===" && tail -n 80 xcodebuild.log && exit 1)

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/derivedData/Build/Products/Release-iphoneos/pinder.app build/Payload/
          cd build
          zip -r -y pinder.ipa Payload
          ls -lh pinder.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinder-altstore-ipa
          path: build/pinder.ipa
          retention-days: 14
